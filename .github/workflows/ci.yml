name: Local-contract checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # FuncLoom (the rewrite API RefacTrail depends on) is not on PyPI
      # yet. While its repository is private, the FUNCLOOM_READ_TOKEN
      # secret holds a read-only token for it; once public, none is needed.
      - uses: actions/checkout@v4
        with:
          repository: SAMtheROCKET/funcloom
          path: funcloom-src
          token: ${{ secrets.FUNCLOOM_READ_TOKEN || github.token }}
      - run: python -m pip install ./funcloom-src
      # refactrail-core is a dependency; before publication the local
      # pure-Python fallback wheel satisfies it (Python engine).
      - run: python -m pip install ./rust/fallback
      - run: python -m pip install -e ".[release]"
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: python -m twine check --strict dist/*
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test editor/refactrail/test/runner.test.js editor/refactrail/test/setup.test.js
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p refactrail-lexer -p refactrail-parser -p refactrail-engine -p refactrail-cli
        working-directory: rust
