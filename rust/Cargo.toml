[package]
name = "refactrail-core"
version = "0.3.2"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "Compiled rule engine for RefacTrail (same findings as the Python engine)"
publish = false

[lib]
name = "refactrail_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py312"] }
rayon = "1.12"
refactrail-engine = { path = "crates/engine" }

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
members = [".", "crates/lexer", "crates/parser", "crates/engine", "crates/cli"]
